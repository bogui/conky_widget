conky.config = {
    -- Window settings
    alignment = 'top_left',
    background = false,
    border_width = 0,
    cpu_avg_samples = 2,
    default_color = '#E0E0E0',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'Liberation Sans:size=10',
    gap_x = 400,  -- Positioned to the right of first widget
    gap_y = 25,   -- Same vertical position as first widget
    minimum_height = 5,
    minimum_width = 220,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_wayland = false,
    out_to_x = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 180,
    own_window_hints = 'undecorated,sticky,below,skip_taskbar,skip_pager',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 2.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
    xinerama_head = 1,
}

conky.text = [[
${offset 15}
${voffset 15}
${color #FFFFFF}${font Liberation Sans:bold:size=14}КАЛЕНДАР${font}${color}
${hr 2}
${color #B0B0B0}Дата:${color #FFFFFF} ${execpi 60 ~/.local/bin/date_bg.py date}
${color #B0B0B0}Час:${color #FFFFFF} ${time %H:%M:%S}
${color #B0B0B0}Седмица:${color #FFFFFF} ${execpi 300 ~/.local/bin/date_bg.py week}

${color #FFFFFF}${font Liberation Sans:bold:size=14}Прогноза за Русе${font}${color}
${hr 2}
${color #B0B0B0}Сега:${color #FFFFFF} ${execpi 600 ~/.local/bin/weather_ruse.py current}
${color #B0B0B0}Днес:${color #FFFFFF}
${execpi 600 ~/.local/bin/weather_ruse.py today}
${color #B0B0B0}Седмица:${color #FFFFFF}
${execpi 600 ~/.local/bin/weather_ruse.py week}
${voffset 15}
]]
